<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>봄의 계절</title>
    <style>
        /* 봄 페이지 테마 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffbdf1; /* 연분홍색 배경 */
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .container {
            margin-top: 100px;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            color: #b30086; /* 진분홍색 텍스트 */
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .line {
            width: 450px;
            height: 4px;
            background-color: #333;
            margin: 0 auto;
        }

        .image-box {
            margin: 15px 0;
        }

        /* 이미지 크기 고정 */
        .image-box img {
            width: 450px;
            height: 300px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 15px;
            color: #111;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>봄의 계절</h1>
        
        <div class="line"></div>
        
        <div class="image-box">
            <!-- 실제 봄 이미지 파일 이름(예: spring.jpg)으로 src를 변경하세요 -->
            <a href="ai_index.html"><img src="images/spring.jpg" alt="봄 벚꽃 풍경"></a>
        </div>
        
        <div class="line"></div>
        
        <!-- 메인화면 index.html 로 이동 -->
        <a href="ai_index.html" class="back-link">[메인화면으로 이동]</a>
    </div>

</body>
</html>
