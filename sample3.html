<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class 응용문제2</title>
    <style>
        body{
            background-color: white;
            text-align: center;
        }

        h2{
            color: green;
        }

        .email{
            color: red;
        }

        hr{
            width: 400px;
            height: 3px;
            background-color: royalblue;
        }
    </style>
</head>
<body>
    <h2>채혜진의 홈페이지에 오신 것을 환영합니다.</h2>
    <p class="text">멋진 홈페이지가 되도록 노력하겠습니다.<br>부디 저의 홈페이지에서 좋은 시간 가지시길 바라며<br>가실 때에 따뜻한 글한마디 남겨주시면 감사하겠습니다.</p>
    <p class="text2">그리고 제 홈페이지에 궁금한 점이 있으시면</p>
    <span class="email"><em><ins>xxxxx@naver.com</ins></em></span><span>으로</span>
    <p>메일 보내주시기 바랍니다.</p>
    <p class="date">2020년 7월 30일</p>
    <hr>
    <h2>이젠컴퓨터학원 강의실에서</h2>
    <hr>
</body>
</html>
