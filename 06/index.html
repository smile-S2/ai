<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if문 제1형식</title>
</head>
<body>
    <script>
        // if문(조건문) 제 1형식
        // if(조건식){(참일 때 해당 코드를 실행한다)} (거짓일 때 해당 코드를 실행한다)

        // 외부로부터 데이터를 입력받아 그 점수가 80점 이상일 경우 "합격"
        let score = prompt("점수를 입력하세요."); // 외부로부터 데이터를 입력받는 함수 (폼이 나온다)
        if (score>=80){
            alert("합격"); // 참이면 해당 명령을 수행한다
        }

    </script>
</body>
</html>
