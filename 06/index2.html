<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if문 제2형식</title>
</head>
<body>
    <script>
        // if(조건식){조건식이 참일 때 실행}else{조건식이 거짓일 때 실행}
        // 외부로부터 데이터를 받아 점수가 80점 이상이면 "합격", 80점 미만이면 "불합격" 출력
        let score = prompt("점수(0~100)를 입력하세요.")
        if(score>=80){
            alert("합격")
        }else{
            alert("불합격")
        }
    </script>
</body>
</html>
