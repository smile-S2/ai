<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국가정보원 스타일 페이지</title>
    <link rel="stylesheet" href="./css/style2.css">
</head>
<body>

    <section class="main-banner">
        <div class="inner">
            <div class="banner-text">
                <h1>안전하고 평화로운 대한민국을 위해<br>국가정보원이 함께합니다.</h1>
            </div>

            <div class="card-container">
                <a href="#" class="card">
                    <div class="img-box">
                        <img src="./images/img_about_1.jpg" alt="직무">
                    </div>
                    <div class="text-box">
                        <span>직무</span>
                    </div>
                </a>

                <a href="#" class="card">
                    <div class="img-box">
                        <img src="./images/img_about_2.png" alt="국정원 역사">
                    </div>
                    <div class="text-box">
                        <span>국정원 역사</span>
                    </div>
                </a>

                <a href="#" class="card">
                    <div class="img-box">
                        <img src="./images/img_about_3.jpg" alt="관련 법령">
                    </div>
                    <div class="text-box">
                        <span>관련 법령</span>
                    </div>
                </a>
            </div>
        </div>
    </section>

</body>
</html>
