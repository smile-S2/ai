<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Community Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">COMMUNITY</div>
        <div class="description">
            삼양식품은 혁신적인 기술과 포용적인 사고로 여러분과 함께<br>
            새로운 식문화를 만들어갑니다.
        </div>
        <div class="sns-icons">
            <div class="icon fb"><a href="#"><img src="images/ico_facebook.png" alt="facebook"></a></div>
            <div class="icon ig"><a href="#"><img src="images/ico_insta.png" alt="instagram"></a></div>
            <div class="icon blog"><a href="#"><img src="images/ico_blog.png" alt="blog"></a></div>
            <div class="icon tw"><a href="#"><img src="images/ico_twitter.png" alt="twitter"></a></div>
        </div>
    </div>

    <div class="main-content">
        
        <div class="column col-left">
            <div class="box box-sns"></div>
        </div>

        <div class="column col-mid">
            <div class="box box-promo">
                <div class="box-title">홍보영상</div>
                <div class="box-text">삼양식품의 다채로운 스토리를<br>영상으로 보여드립니다.</div>
                <div class="btn-more">자세히 보기</div>
            </div>
            <div class="box box-inquiry">
                <div class="box-title">고객 문의</div>
                <div class="box-text">삼양식품에게<br>여러분의 다양한 의견을 남겨주세요.</div>
                <div class="btn-more">자세히 보기</div>
            </div>
        </div>

        <div class="column col-right">
            <div class="box box-sharing">
                <div class="box-title">맛있는 나눔</div>
                <div class="box-text">모두가 행복한 맛있는 세상</div>
                <div class="btn-more">자세히 보기</div>
            </div>
            <div class="box box-notice">
                <div class="box-title">공지사항</div>
                <div class="box-text">삼양식품 개인정보취급방침 개정 안내</div>
                <div class="btn-more">자세히 보기</div>
            </div>
            <div class="box box-mall">
                <div class="box-title">삼양식품 공식몰</div>
                <div class="box-text">삼양식품의<br>다양한 제품을 만나보세요.</div>
                <div class="btn-more">자세히 보기</div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
