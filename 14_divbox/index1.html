<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!--div는 블록요소=아래로 배치됨-->
    <div class="total">
        <div class="first">배너1</div>
        <div class="second">배너2</div>
        <div class="third">배너3</div>
    </div>
    <!--ul>li도 블록요소=아래로 배치됨-->
    <ul class="box">
        <li>배너1</li>
        <li>배너2</li>
        <li class="third2">배너3</li>
    </ul>
</body>
</html>
