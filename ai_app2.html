<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그렇게 사랑합니다</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #7dd87d;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 30px 40px;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    /* 제목 */
    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    /* 저자 */
    .author {
      text-align: right;
      font-size: 14px;
      margin-bottom: 40px;
    }

    /* 첫 번째 연 - 왼쪽 */
    .stanza-1 {
      margin-bottom: 30px;
      line-height: 1.9;
    }

    /* 두 번째 연 - 중앙 */
    .stanza-2 {
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.9;
    }

    /* 세 번째 연 - 오른쪽 */
    .stanza-3 {
      text-align: right;
      line-height: 1.9;
    }

    p {
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="title">그렇게 사랑합니다.</div>

    <div class="author">-한용운-</div>

    <div class="stanza-1">
      <p>사랑한다는 사랑앞에서는</p>
      <p>사랑 한다는말을 안합니다.</p>
      <p>안하는것이아니라</p>
      <p>못하는것이 사랑의 진실입니다.</p>
    </div>

    <div class="stanza-2">
      <p>잊어버려야 하겠다는 말은</p>
      <p>잊을수 없다는말입니다.</p>
      <p>정말 잊고싶을 때는 말이 없습니다.</p>
    </div>

    <div class="stanza-3">
      <p>헤어질때 돌아보지 않는것은</p>
      <p>너무 헤어지기 싫기때문입니다.</p>
      <p>그것은 헤어지는것이 아니라</p>
      <p>같이 있다는 말입니다.</p>
    </div>

  </div>
</body>
</html>
