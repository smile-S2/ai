<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수평선삽입과class</title>
    <style>
        body{
            background-color: #ffedf0;
        }

        h1{
            text-align: center;
            color:crimson;
        }
        
        p{
            text-align: center;
        }
        
        .orange{
            color: #ffa500;
        }

        .blue{
            color: royalblue;
        }

        .yellow{
            color: yellowgreen;
        }

        .green{
            color: green;
        }

        .hr1{
            width: 300px;
            height: 10px;
            background-color: orange;
        }

        .hr2{
            width: 350px;
            height: 5px;
            background-color: royalblue;  /** 수평선은 background-color로 변경**/
        }

        .hr3{
            width: 280px;
            height: 1px;
            background-color: yellowgreen;
        }

        .hr4{
            width: 350px;
            height: 1px;
            background-color: orange;
        }

        .hr5{
            width: 300px;
            height: 1px;
            background-color: royalblue;
        }

        .hr6{
            width: 480px;
            height: 1px;
            background-color: yellowgreen;
        }

        .hr7{
            width: 400px;
            height: 10px;
            background-color: #ffa500;
        }

        .hr8{
            width: 100%;
            height: 7px;
            background-color: royalblue;
        }
    </style>
</head>
<body>
    <h1>절대반지는?</h1>
    <p class="orange">반지 세 개는 하늘 아래 <strong>요정왕</strong>들을 위한 것.</p>
    <hr class="hr1">
    <p class="blue">일곱 개는 <em>돌의 전당</em> 에 있는 <ins>난쟁이 군주</ins> 들을 위한 것.</p>
    <hr class="hr2">
    <p class="yellow">아홉 개는 죽은 운명의 인간을 위한 것.</p>
    <hr class="hr3">
    <p class="orange">하나는 암흑의 왕좌에 앉은 암흑 제왕을 위한 것.</p>
    <hr class="hr4">
    <p class="blue">그곳은 망령들이 지배라는 모르도르의 땅,</p>
    <hr class="hr5">
    <p class="yellow">그 모든 반지를 다스릴 반지 하나, 그 모든 반지를 찾기 위한 절대반지,</p>
    <hr class="hr6">
    <p class="orange">그 모든 반지를 암흑 속에 가두기 위한 반지는 절대반지뿐,</p>
    <hr class="hr7">
    <p class="blue">바로 망령들이 누워 있는 모르도르의 땅에</p>
    <hr class="hr8">
    <p class="green"><em><strong>반지의 제왕 중에서...</strong></em></p>
</body>
</html>
