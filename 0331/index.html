<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POGEUN | 포근포근 쇼핑몰</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <header class="header">
            <h1 class="logo" onclick="location.href='index.html'">POGEUN</h1>
            <div class="header-icons">
                <div class="icon-search">🔍</div>
                <div class="icon-cart" onclick="location.href='cart.html'">
                    🛒<span class="cart-count">3</span>
                </div>
            </div>
        </header>

        <section class="banner-container">
            <div class="banner-wrapper" id="bannerWrapper">
                <div class="banner-item color-1">
                    <span class="tag">HOT</span>
                    <h2>포근한 니트 가디건<br>최대 30% 할인 중 ✨</h2>
                    <button class="btn-more">보러가기</button>
                </div>
                <div class="banner-item color-2">
                    <span class="tag">EVENT</span>
                    <h2>신규 가입하면<br>무료 배송 쿠폰 🎁</h2>
                    <button class="btn-more">쿠폰받기</button>
                </div>
            </div>
        </section>

        <nav class="categories">
            <div class="cat-item active" onclick="filterCategory('전체', this)">전체</div>
            <div class="cat-item" onclick="filterCategory('아우터', this)">아우터</div>
            <div class="cat-item" onclick="filterCategory('상의', this)">상의</div>
            <div class="cat-item" onclick="filterCategory('하의', this)">하의</div>
            <div class="cat-item" onclick="filterCategory('잡화', this)">잡화</div>
        </nav>

        <main class="product-grid" id="productGrid">
            <div class="product-card" data-category="아우터" onclick="location.href='detail.html?id=item1'">
                <div class="img-box">
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=400&q=80" alt="상품1" style="width:100%; height:100%; object-fit:cover;">
                    <span class="tag">BEST</span>
                    <button class="btn-wish" onclick="event.stopPropagation(); toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">오버핏 울 코트</p>
                    <p class="p-price">128,000원</p>
                    <div class="p-rating">⭐ 4.8 (120)</div>
                </div>
            </div>

            <div class="product-card" data-category="상의" onclick="location.href='detail.html?id=item2'">
                <div class="img-box">
                    <img src="https://images.unsplash.com/photo-1614676471928-2ed0ad1061a4?auto=format&fit=crop&w=400&q=80" alt="상품2" style="width:100%; height:100%; object-fit:cover;">
                    <span class="tag">NEW</span>
                    <button class="btn-wish" onclick="event.stopPropagation(); toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">캐시미어 라운드 니트</p>
                    <p class="p-price">45,000원</p>
                    <div class="p-rating">⭐ 4.9 (85)</div>
                </div>
            </div>

            <div class="product-card" data-category="하의" onclick="location.href='detail.html?id=item3'">
                <div class="img-box">
                    <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=400&q=80" alt="상품3" style="width:100%; height:100%; object-fit:cover;">
                    <button class="btn-wish" onclick="event.stopPropagation(); toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">와이드 데님 팬츠</p>
                    <p class="p-price">39,000원</p>
                    <div class="p-rating">⭐ 4.7 (210)</div>
                </div>
            </div>

            <div class="product-card" data-category="잡화" onclick="location.href='detail.html?id=item4'">
                <div class="img-box">
                    <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80" alt="상품4" style="width:100%; height:100%; object-fit:cover;">
                    <span class="tag">SALE</span>
                    <button class="btn-wish" onclick="event.stopPropagation(); toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">가죽 미니 숄더백</p>
                    <p class="p-price">52,000원</p>
                    <div class="p-rating">⭐ 4.6 (42)</div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="location.href='index.html'">🏠<span>홈</span></div>
            <div class="nav-item" onclick="location.href='category.html'">🛍️<span>카테고리</span></div>
            <div class="nav-item" onclick="location.href='wishlist.html'">❤️<span>찜</span></div>
            <div class="nav-item" onclick="location.href='mypage.html'">👤<span>마이</span></div>
        </nav>
    </div>

    <script src="./script/script.js"></script>
    <script>
        function filterCategory(category, element) {
            // 탭 컬러 변경
            const tabs = document.querySelectorAll('.cat-item');
            tabs.forEach(tab => tab.classList.remove('active'));
            if (element) element.classList.add('active');

            // 상품 필터링
            const products = document.querySelectorAll('.product-card');
            products.forEach(product => {
                const productCat = product.getAttribute('data-category');
                product.style.display = (category === '전체' || productCat === category) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
