<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POGEUN | 찜한 상품</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 찜 페이지 전용 추가 스타일 */
        .wish-empty {
            text-align: center;
            padding: 100px 20px;
            color: #bbb;
        }
        .wish-empty span {
            display: block;
            font-size: 50px;
            margin-bottom: 20px;
        }
        .wish-count-text {
            padding: 0 20px 15px;
            font-size: 14px;
            color: var(--text-gray);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <div class="back-btn" onclick="history.back()">←</div>
            <h1 class="logo-center">찜한 상품</h1>
            <div class="header-icons">
                <div class="icon-cart" onclick="location.href='cart.html'">
                    🛒<span class="cart-count">3</span>
                </div>
            </div>
        </header>

        <div class="wish-count-text">전체 <b>4</b>개</div>

        <main class="product-grid">
            <div class="product-card">
                <div class="img-box item-bg-1">
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=400&q=80" style="width:100%; height:100%; object-fit:cover;">
                    <button class="btn-wish active" style="color: var(--main-pink);" onclick="toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">오버핏 울 코트</p>
                    <p class="p-price">128,000원</p>
                    <button class="btn-order" style="width: 100%; height: 35px; font-size: 12px; margin-top: 10px; box-shadow: none;">장바구니 담기</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box item-bg-2">
                    <img src="https://images.unsplash.com/photo-1614676471928-2ed0ad1061a4?auto=format&fit=crop&w=400&q=80" style="width:100%; height:100%; object-fit:cover;">
                    <button class="btn-wish active" style="color: var(--main-pink);" onclick="toggleLike(this)">♥</button>
                </div>
                <div class="info-box">
                    <p class="p-name">캐시미어 라운드 니트</p>
                    <p class="p-price">45,000원</p>
                    <button class="btn-order" style="width: 100%; height: 35px; font-size: 12px; margin-top: 10px; box-shadow: none;">장바구니 담기</button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="location.href='index.html'">🏠<span>홈</span></div>
            <div class="nav-item" onclick="location.href='category.html'">🛍️<span>카테고리</span></div>
            <div class="nav-item active" onclick="location.href='wishlist.html'">❤️<span>찜</span></div>
            <div class="nav-item" onclick="location.href='mypage.html'">👤<span>마이</span></div>
        </nav>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
