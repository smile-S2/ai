<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>절대반지는?</title>
  <style>
    body {
      text-align: center;
      background: white;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
    }

    .line-wrap {
      display: inline-block;
      text-align: center;
      margin: 4px 0;
    }

    .line-wrap p {
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    .line-wrap hr {
      margin: 2px auto 0;
      border: none;
      border-top: 1px solid currentColor;
      width: 100%;
    }

    .block {
      display: block;
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <div>

    <h2 style="color: red;">절대반지는?</h2>

    <div class="block">
      <div class="line-wrap" style="color: red;">
        <p>반지 세 개는 하늘 아래 요정왕들을 위한 것,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: #cc8800;">
        <p>일곱 개는 돌의 전당에 있는 난쟁이 군주들을 위한 것,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: #44aa44;">
        <p>아홉 개는 죽은 운명의 인간을 위한 것,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: #0000cc;">
        <p>하나는 암흑의 왕좌에 앉은 암흑 제왕을 위한 것,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: black;">
        <p>그곳은 망령들이 지배라는 모르도르의 땅,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: #cc8800;">
        <p>그 모든 반지를 다스릴 반지하나, 그 모든 반지를 찾기 위한 절대반지,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: #44aa44;">
        <p>그 모든 반지를 암흑 속에 가두기 위한 반지는 절대반지뿐,</p>
        <hr />
      </div>
    </div>

    <div class="block">
      <div class="line-wrap" style="color: black;">
        <p>바로 망령들이 누워 있는 모르도르의 땅에</p>
      </div>
      <hr style="border: none; border-top: 1px solid black; width: 100%; margin: 2px auto 0;" />
    </div>

    <div class="block" style="margin-top: 8px;">
      <div class="line-wrap" style="color: red;">
        <p style="font-style: italic;">반지의 제왕 중에서….</p>
      </div>
    </div>

  </div>
</body>
</html>
