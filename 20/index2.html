<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문서</title>
    <link rel="stylesheet" href="./css/style2.css">
</head>
<body>
    <h1>상품 주문서</h1>
    <form method="POST">
        <fieldset>
            <legend>개인 정보</legend>
            <ul>
                <li>
                    <label for="">이름</label>
                    <input type="text" placeholder="여백없이 입력" required>
                </li>
                <li>
                    <label for="">비밀번호</label>
                    <input type="password" required placeholder="비밀번호를 입력하세요">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>배송지 정보</legend>
            <ul>
                <li>
                    <label for="">주소</label>
                </li>
                <li>
                    <label for="">전화번호</label>
                    <select><option value="011">011</option><option value="010">010</option></select> <input type="text" maxlength="4"> <input type="text" maxlength="4">
                </li>
                <li>
                    <label for="">메모</label>
                    <textarea cols="26" rows="3" placeholder="여기에 메모를 입력하세요"></textarea>
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>주문 정보</legend>
            <ul>
                <li>
                    <label>과테말라 안티구아 (100g)</label>
                    <input type="number" name="" id="" value="0" min="0" max="10">개
                </li>
                <li>
                    <label>인도네시아 만델링 (100g)</label>
                    <input type="number" name="" id="" value="0" min="0" max="10">개
                </li>
                <li>
                    <label>탐라는도다 (블렌딩) (100g)</label>
                    <input type="number" name="" id="" value="0" min="0" max="10">개
                </li>
                <li>
                    <label for="">01</label>
                    <input type="checkbox" name="" id="">
                    <label for="">02</label>
                    <input type="checkbox" name="" id="">
                    <label for="">03</label>
                    <input type="checkbox" name="" id="">
                    <label for="">04</label>
                    <input type="checkbox" name="" id="">
                </li>
                <li>
                    <label for="">r01</label>
                    <input type="radio" name="select" id="">
                    <label for="">r02</label>
                    <input type="radio" name="select" id="">
                    <label for="">r03</label>
                    <input type="radio" name="select" id="">
                    <label for="">r04</label>
                    <input type="radio" name="select" id="">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>버튼 모음</legend>
            <button type="submit">주문하기</button>
        </fieldset>
    </form>
</body>
</html>
