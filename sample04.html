<!DOCTYPE html>
<html lang="ko">
<head>

    <title>sample04</title>
    <style>
        h1{
            color: red;
        }
        ol li{
            color: blue;
        }
        ul li{
            color: black;
            list-style: square;
        }
    </style>
</head>
<body>

        <h1>반드시 취득할 필수 국가자격증</h1>

        <ol>

                <ul>
                    <li>워드프로세서 1급, 2급</li>
                    <li>컴퓨터활용능력 (엑셀) 2급</li>
                </ul>
            </li>
            <li>2008년 그래픽스관련분야
                <ul>
                    <li>웹디자인기능사</li>
                    <li>컴퓨터 그래픽스</li>
                    <li>멀티컨텐츠 제작전문가</li>
                </ul>
            </li>
            <li>2008년 인터넷관련 자격증
                <ul>
                    <li>인터넷정보검색사</li>
                </ul>
            </li>
        </ol>
    </div>
</body>
</html>
