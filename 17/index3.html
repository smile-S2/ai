<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM2</title>
    <link rel="stylesheet" href="./css/style3.css">
</head>
<body>
    <h1>회원 가입</h1>
    <form action="">
        <fieldset>
            <legend>필수정보</legend>
            <div class="must">
                <ul>
                    <li>
                        <label for="name">이름 :</label>
                        <input type="text" name="name" id="name">
                    </li>
                </ul>
            </div>
        </fieldset>
        <fieldset>
            <legend>선택정보</legend>
            <div class="info">
                <ul>
                    <li>
                        <label for="date">생일 :</label>
                        <input type="date" name="date" id="date">
                    </li>
                </ul>
            </div>
        </fieldset>
    </form>
</body>
</html>
