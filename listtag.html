<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tag</title>
    <style>
        ul{
            color: red;
            list-style: circle;
        }

        .plane{
            color: blue;
            list-style: upper-alpha ;
        }

        .land{
            color: green;
            list-style: disc;
        }

        ul li ul li{ /*부모에서 자식 순서대로 써주면 됨*/
            list-style: square;
        }

        .eat{
            color: blue;
            list-style: decimal;
        }
    </style>
</head>
<body>
    <div class="listtag"> <!--리스트태그에는 li만 삽입가능-->
        <h1>순서 없는 목록(타는 것)</h1>
        <hr>
        <ul> <!--순서 없는 목록-->
            <li>비행기
                <ol class="plane">
                    <li>국내용</li>
                    <li>국제용
                        <ol class="land"> <!--순서 있는 목록-->
                            <li>미주지역</li>
                            <li>아시아지역</li>
                            <li>유럽지역</li>
                        </ol>
                    </li>
                </ol>
            </li>
            <li>버스
                <ul>
                    <li>시내버스</li>
                    <li>시외버스</li>
                </ul>
            </li>
            <li>기차</li>
        </ul>
    </div>

    <hr>

    <div class="listtag2">
        <h1>순서 있는 목록(먹는 것)</h1>
        <hr>
        <ol class="eat">
            <li>바나나</li>
            <li>딸기</li>
            <li>수박</li>
        </ol>
    </div>
</body>
</html>
