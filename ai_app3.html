<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미소의 홈페이지</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        .container {
            text-align: center;
            padding-top: 60px;
        }

        .title {
            color: #008000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .intro {
            font-size: 14px;
            line-height: 2;
            color: #000000;
            margin-bottom: 25px;
        }

        .contact {
            font-size: 14px;
            line-height: 2;
            color: #000000;
            margin-bottom: 20px;
        }

        .contact a {
            color: #cc0000;
            text-decoration: underline;
        }

        .date {
            font-size: 14px;
            color: #000000;
            margin-bottom: 30px;
        }

        .divider-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin-bottom: 20px;
        }

        .divider-blue {
            width: 280px;
            border: none;
            border-top: 3px solid #00008B;
        }

        .footer-title {
            color: #008000;
            font-size: 28px;
            font-weight: bold;
            margin: 15px;
            letter-spacing: 1px;
        }

        .divider-bottom {
            width: 280px;
            border: none;
            border-bottom: 3px solid #00008B;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="title">이미소의 홈페이지에 오신 것을 환영합니다.</p>

        <p class="intro">
            멋진 홈페이지가 되도록 노력하겠습니다.<br>
            부디 저의 홈페이지에서 좋은 시간 가지시기 바라며<br>
            가실 때에 따뜻한 글한마디 남겨주시면 감사하겠습니다.
        </p>

        <p class="contact">
            그리고 제 홈페이지에 궁금한 점이 있으시면<br>
            <a href="mailto:xxxxx@naver.com">xxxxx@naver.com</a>으로<br>
            메일 보내주시기 바랍니다.
        </p>

        <p class="date">2020년 7월 30일</p>

        <div class="divider-wrap">
            <hr class="divider-blue">
        </div>

        <p class="footer-title">KD 아카데미 강의실에서</p>

        <hr class="divider-bottom">
    </div>
</body>
</html>
