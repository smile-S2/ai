<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Claude 스타일 레이아웃</title>
    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-width: 1200px;
        }

        /* 헤더 전체 영역 */
        header {
            width: 100%;
            background-color: #2c2926; /* 상단 어두운 배경색 */
            position: relative;
            z-index: 1000;
        }

        /* 상단 GNB 영역 */
        .gnb-container {
            width: 1200px;
            margin: 0 auto;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
        }

        /* 로고 */
        .logo {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            gap: 10px;
            width: 200px;
        }

        .logo-icon {
            color: #e67e22; /* 로고 주황색 아이콘 */
            font-size: 32px;
        }

        /* 1차 메뉴 */
        .main-menu {
            display: flex;
            list-style: none;
            gap: 40px;
            height: 100%;
            flex: 1;
        }

        .menu-item {
            position: relative; /* 2차 메뉴의 시작 위치를 1차 메뉴 기준으로 설정 */
            height: 80px;
            display: flex;
            align-items: center;
        }

        .menu-link {
            text-decoration: none;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* 호버 시 텍스트 색상 및 헤더 최하단 밑줄 */
        .menu-item:hover > .menu-link {
            color: #e67e22;
        }

        .menu-item:hover > .menu-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #e67e22;
            z-index: 1001;
        }

        /* 우측 버튼 영역 */
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-search {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-search:hover {
            background-color: #333;
        }

        .btn-market {
            background-color: #e67e22;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn-market:hover {
            opacity: 0.9;
        }

        /* 2차 메뉴 (LNB) 영역 - 세로 드롭다운 형식 */
        .lnb-container {
            display: none; /* 기본적으로 숨김 */
            position: absolute;
            top: 80px;
            left: 50%; /* 부모(1차메뉴) 기준 가운데 배치 */
            transform: translateX(-50%); /* 정확한 중앙 정렬 */
            width: 180px; /* 드롭다운 너비 */
            background-color: #211e1c;
            z-index: 999;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            padding: 10px 0;
        }

        .lnb-inner {
            display: flex;
            flex-direction: column; /* 세로 나열 */
            gap: 0;
        }

        .lnb-link {
            text-decoration: none;
            color: #999;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            padding: 12px 20px;
            display: block;
            white-space: nowrap;
            text-align: center; /* 텍스트 정렬 가운데로 변경 */
        }

        .lnb-link:hover {
            color: #e67e22;
            background-color: #2c2926; /* 호버 시 배경색 약간 밝게 */
        }

        /* 메인 메뉴 호버 시 LNB 노출 */
        .menu-item:hover .lnb-container {
            display: block;
        }

        /* 배경 이미지 영역 */
        .hero-section {
            width: 100%;
            height: calc(100vh - 80px);
            background-image: url('https://images.unsplash.com/photo-1520106212299-d99c443e4568?q=80&w=1974&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15); 
        }
    </style>
</head>
<body>

    <header>
        <div class="gnb-container">
            <!-- 로고 -->
            <a href="#" class="logo">
                <span class="logo-icon">❈</span> Claude
            </a>

            <!-- GNB -->
            <nav style="height: 100%; flex: 1;">
                <ul class="main-menu">
                    <!-- ABOUT -->
                    <li class="menu-item">
                        <a href="#" class="menu-link">ABOUT</a>
                        <div class="lnb-container">
                            <div class="lnb-inner">
                                <a href="#" class="lnb-link">대표인사</a>
                                <a href="#" class="lnb-link">기업소개</a>
                                <a href="#" class="lnb-link">비주얼 아이덴티티</a>
                                <a href="#" class="lnb-link">사회공헌</a>
                                <a href="#" class="lnb-link">오시는길</a>
                            </div>
                        </div>
                    </li>
                    <!-- PRODUCTS -->
                    <li class="menu-item">
                        <a href="#" class="menu-link">PRODUCTS</a>
                        <div class="lnb-container">
                            <div class="lnb-inner">
                                <a href="#" class="lnb-link">AI & 인공지능</a>
                                <a href="#" class="lnb-link">Sonnet 모델</a>
                                <a href="#" class="lnb-link">Coding pro</a>
                                <a href="#" class="lnb-link">대표적인 AI</a>
                            </div>
                        </div>
                    </li>
                    <!-- PARTNERSHIP -->
                    <li class="menu-item">
                        <a href="#" class="menu-link">PARTNERSHIP</a>
                        <div class="lnb-container">
                            <div class="lnb-inner">
                                <a href="#" class="lnb-link">가맹점 현황</a>
                                <a href="#" class="lnb-link">가맹점 개설 안내</a>
                                <a href="#" class="lnb-link">제휴 문의</a>
                            </div>
                        </div>
                    </li>
                    <li class="menu-item">
                        <a href="#" class="menu-link">EDUCATION</a>
                    </li>
                    <li class="menu-item">
                        <a href="#" class="menu-link">WHAT'S NEW</a>
                    </li>
                    <li class="menu-item">
                        <a href="#" class="menu-link">SUPPORT</a>
                    </li>
                </ul>
            </nav>

            <!-- 우측 버튼 -->
            <div class="header-right">
                <button class="btn-search">매장찾기</button>
                <button class="btn-market">클로드마켓</button>
            </div>
        </div>
    </header>

    <!-- 메인 비주얼 -->
    <main class="hero-section">
        <div class="hero-overlay"></div>
    </main>

</body>
</html>
