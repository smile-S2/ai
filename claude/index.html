<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Claude Header</title>
    <style>
        /* 기본 초기화 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 시안과 같이 고정된 데스크톱 레이아웃을 위해 넓은 최소 너비 적용 */
            min-width: 1400px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: #f5f5f5; /* 헤더 아래 임시 배경색 */
        }

        /* 헤더 전체 래퍼 */
        .header {
            width: 100%;
            height: 76px;
            background-color: #3f3e3d; /* 시안의 어두운 회갈색 배경 */
            display: flex;
            justify-content: center;
        }

        /* 중앙 정렬 및 넓이 고정 컨테이너 */
        .header-inner {
            width: 1200px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* 로고 영역 */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            letter-spacing: -0.5px;
            font-weight: 500;
        }

        /* 네비게이션 영역 (가운데 정렬 고정) */
        .main-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 40px;
            height: 100%; /* 부모 높이 전체 사용 */
        }

        .main-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            
            /* 텍스트 중앙 정렬 및 전체 높이 차지 */
            height: 100%;
            display: flex;
            align-items: center;
            
            /* 하단 라인 설정 */
            border-bottom: 4px solid transparent; /* 라인 두께를 조금 더 명확하게 조절 */
            transition: color 0.2s, border-bottom-color 0.2s;
            white-space: nowrap; 
        }

        /* 마우스 호버 시 주황색 및 헤더 최하단 라인 효과 */
        .main-nav a:hover {
            color: #e5735a;
            border-bottom-color: #e5735a;
        }

        /* 우측 버튼 영역 */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions button {
            height: 36px;
            padding: 0 20px;
            border-radius: 18px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .header-actions button:hover {
            opacity: 0.9;
        }

        /* 어두운 색 버튼 (매장찾기) */
        .btn-dark {
            background-color: #2c2b2b;
            color: #ffffff;
        }

        /* 메인 포인트 색상 버튼 (클로드마켓) */
        .btn-accent {
            background-color: #e5735a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <!-- 좌측 로고 -->
            <a href="#" class="logo-area">
                <div class="logo-icon">
                    <svg width="34" height="34" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <g fill="#e5735a">
                            <ellipse cx="20" cy="8" rx="2.5" ry="8" />
                            <ellipse cx="20" cy="32" rx="2.5" ry="8" />
                            <ellipse cx="8" cy="20" rx="8" ry="2.5" />
                            <ellipse cx="32" cy="20" rx="8" ry="2.5" />
                            <ellipse cx="11.5" cy="11.5" rx="2.5" ry="8" transform="rotate(45 11.5 11.5)" />
                            <ellipse cx="28.5" cy="28.5" rx="2.5" ry="8" transform="rotate(45 28.5 28.5)" />
                            <ellipse cx="28.5" cy="11.5" rx="2.5" ry="8" transform="rotate(-45 28.5 11.5)" />
                            <ellipse cx="11.5" cy="28.5" rx="2.5" ry="8" transform="rotate(-45 11.5 28.5)" />
                        </g>
                    </svg>
                </div>
                <span class="logo-text">Claude</span>
            </a>

            <!-- 중앙 네비게이션 -->
            <nav class="main-nav">
                <a href="#">ABOUT</a>
                <a href="#">PRODUCTS</a>
                <a href="#">MEMBERSHIP</a>
                <a href="#">EDUCATION</a>
                <a href="#">WHAT'S NEW</a>
                <a href="#">SUPPORT</a>
            </nav>

            <!-- 우측 버튼 -->
            <div class="header-actions">
                <button class="btn-dark">매장찾기</button>
                <button class="btn-accent">클로드마켓</button>
            </div>
        </div>
    </header>

</body>
